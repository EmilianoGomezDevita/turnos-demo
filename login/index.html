<!doctype html>
<html lang="es-AR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar · Panel del negocio</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="pagina-login">
    <header class="encabezado" id="encabezado"></header>
    <main class="contenedor">
        <div class="intro">
            <h1 class="intro__titulo" id="titulo">Ingrear al panel</h1>
            <form class="tarjeta" id="form-login" novalidate> 
                <label class="campo">
                    <span>Clave</span>
                    <input type="password" name="clave" id="clave" autocomplete="current-password" required>
                </label>
                <p id="error" role="alert" hidden></p>
                <div class="acciones">
                    <a class="boton boton--secundario" href="../">Volver</a>
                    <button type="submit" class="boton boton--primario">Ingresar</button>
                </div>
                <p class="aviso-demo" id="aviso-demo"></p>
            </form>
        </div>
    </main>
    <footer class="pie" id="pie"></footer>
    <script type="module" src="../js/login.js"></script>
</body>

</html>
